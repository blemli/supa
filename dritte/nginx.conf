# dritte front-proxy: contributes /up, passes everything else to envoy untouched.
# runs alongside envoy in the same container; kamal-proxy terminates TLS in front.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events { worker_connections 512; }

http {
    map_hash_bucket_size 256;   # auth map keys ("Basic <b64>") exceed the default 64; must precede all maps
    access_log off;
    client_max_body_size 100m;   # storage FILE_SIZE_LIMIT is 50m
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # second dashboard login: start.sh renders the translation pair from DASHBOARD2_* env
    map $http_authorization $auth_fwd {
        default $http_authorization;
        include /tmp/auth-map.conf;
    }

    server {
        listen 8080;   # deploy.yml app_port

        location = /favicon.svg {              # official logo for the up.problem.li tile (dashboard itself is basic-auth'd)
            default_type image/svg+xml;
            alias /dritte/favicon.svg;
        }

        location = /up {                       # the point of this file
            resolver 127.0.0.11 valid=10s;     # re-resolve when the studio accessory reboots
            set $studio supa-studio;
            proxy_pass http://$studio:3000/api/platform/profile;   # studio's own health route
        }

        location / {
            proxy_pass http://127.0.0.1:8000;   # envoy
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization $auth_fwd;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;      # realtime websockets
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }
    }
}
